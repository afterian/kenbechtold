<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrie 7 - Ken Bechtold</title>
  <meta name="description" content="Kyrie 7. A footwear modeling fragment by Ken Bechtold.">
  <meta name="theme-color" content="#08080a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308080a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2333ff99'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="../../assets/css/footwear.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <main class="fragment-page">
    <a class="fragment-page__back mono" href="../../#fragments">&larr; Fragments</a>
    <header class="fragment-page__head">
      <h1>Kyrie 7</h1>
      <p class="mono">Nike / Footwear</p>
    </header>
    <div class="fragment-page__viewer footwear" data-footwear data-state="loading" aria-label="Kyrie 7 interactive model">
      <div class="footwear__viewport">
        <img class="footwear__poster" src="./media/poster.webp" alt="Kyrie 7 footwear model">
        <div class="footwear__feedback"><span role="status" aria-live="polite">3D model</span></div>
      </div>
    </div>
    <ul class="fragment-page__tags" aria-label="Tags">
      <li>Fragments</li><li>3D</li><li>SubD</li><li>Modeling</li><li>Footwear</li><li>Nike</li><li>Polygon</li>
    </ul>
    <noscript><p class="mono">Enable JavaScript to explore the model.</p></noscript>
  </main>
  <script type="module">
    const host = document.querySelector('[data-footwear]');
    const config = {
      title: 'Kyrie 7', model: './media/model.glb', wire: './media/wire.glb', poster: './media/poster.webp',
      modelBytes: 1842716, wireBytes: 1426604, triangles: 76491, edgeSegments: 116630
    };
    let handle, generation = 0;
    async function start() {
      const token = ++generation;
      try {
        const { mountModelViewer } = await import('../../assets/js/footwear-viewer.js');
        if (token !== generation) return;
        const mounted = await mountModelViewer(host, config);
        if (token !== generation) mounted.dispose();
        else handle = mounted;
      } catch {
        if (token !== generation) return;
        host.dataset.state = 'error';
        const feedback = host.querySelector('.footwear__feedback');
        feedback.replaceChildren();
        const status = document.createElement('span'); status.setAttribute('role', 'status');
        status.textContent = '3D view unavailable.';
        const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Retry';
        retry.addEventListener('click', () => location.reload());
        feedback.append(status, retry);
      }
    }
    window.addEventListener('pagehide', () => { generation++; handle?.dispose(); });
    window.addEventListener('pageshow', event => { if (event.persisted) void start(); });
    void start();
  </script>
</body>
</html>
