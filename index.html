<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <title>Ken Bechtold</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f4f2ed;
      color: #242321;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 18rem;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      text-align: center;
    }

    h1,
    p {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.125rem);
      font-weight: 600;
      line-height: 1.6;
      letter-spacing: -0.015em;
    }

    a {
      color: inherit;
      text-decoration: none;
      text-underline-offset: 0.2em;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 0.25rem;
      border-radius: 1px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Ken Bechtold</h1>
    <p><a href="mailto:ken@afterthehomework.com">ken@afterthehomework.com</a></p>
  </main>
</body>
</html>
